<!doctype html>
<!-- Template "capa" (1º slide do carrossel): fundo vermelho profundo (post fixado/importante) ou creme
     (post comum, ADR-007); eyebrow, título Cormorant 92 px e texto nas cores do fundo (--c-*),
     filete dourado, assinatura tipográfica + seta no rodapé. -->
<html lang="pt-BR"><head><meta charset="utf-8"><base href="$base">
<link rel="stylesheet" href="base.css"><style>$tokens</style>
<style>
  .area { justify-content: flex-end; padding-bottom: 40px; }
  .eyebrow { color: var(--c-eyebrow); }
  .titulo { font-size: 92px; line-height: 1.04; color: var(--c-titulo); }
  .texto { color: var(--c-texto); font-size: 40px; }
</style></head>
<body><main class="arte $fundo">
  <section class="area" data-caixa>
    <p class="eyebrow">$eyebrow</p>
    <h1 class="titulo">$titulo</h1>
    <div class="filete-titulo"></div>
    <p class="texto">$texto</p>
  </section>
  <footer class="rodape" data-rodape>
    <div class="filete"></div>
    <div class="assinatura"><span class="nome">$marca_nome</span><span class="usuario">$usuario</span></div>
    <span class="seta" aria-hidden="true">→</span>
  </footer>
</main></body></html>
