<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="{{csp}}">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="{{creme}}">
<meta name="description" content="Pastoral do Dízimo da Arquidiocese de Florianópolis: fale com a Pastoral.">
<title>Pastoral do Dízimo — Arquidiocese de Florianópolis</title>
<link rel="icon" href="avatar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root {
  --vermelho: {{vermelho}}; --vermelho-profundo: {{vermelho_profundo}}; --creme: {{creme}}; --prata: {{prata}};
  --grafite: {{grafite}}; --cinza: {{cinza}}; --dourado: {{dourado}};
  --titulo: "Cormorant Garamond", Georgia, serif; --apoio: "Source Sans 3", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--creme); color: var(--grafite); font: 400 17px/1.5 var(--apoio); }
main { max-width: 480px; margin: 0 auto; padding: 32px 16px calc(40px + env(safe-area-inset-bottom)); }
[hidden] { display: none !important; }
.topo { text-align: center; }
.avatar { width: 96px; height: 96px; border-radius: 50%; border: 2px solid var(--dourado); display: block; margin: 0 auto 12px; }
h1 { font: 600 34px/1.1 var(--titulo); color: var(--vermelho); margin: 0; }
.sub { margin: 4px 0 0; color: var(--cinza); font-weight: 600; letter-spacing: .02em; }
.lema { font: italic 600 21px/1.3 var(--titulo); margin: 16px 0 0; }
.lema small { display: block; font: 400 14px var(--apoio); color: var(--cinza); margin-top: 2px; }
.filete { border: 0; border-top: 1px solid var(--dourado); width: 64px; margin: 24px auto; }
.convite { text-align: center; margin: 0 0 20px; }
.caminho { display: block; width: 100%; text-align: left; margin: 0 0 14px; padding: 18px 20px; border: 0; border-radius: 14px;
  background: var(--vermelho); color: var(--prata); font: inherit; cursor: pointer; box-shadow: 0 2px 0 var(--vermelho-profundo); }
.caminho:active { transform: translateY(1px); box-shadow: none; }
.caminho strong { display: block; font: 600 22px/1.2 var(--titulo); }
.caminho span { display: block; font-size: 15px; margin-top: 4px; }
.caminho:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 3px solid var(--grafite); outline-offset: 2px; }
.instagram { display: block; text-align: center; color: var(--cinza); margin-top: 28px; font-size: 15px; }
h2 { font: 600 28px/1.15 var(--titulo); color: var(--vermelho); margin: 0 0 16px; }
.voltar { background: none; border: 0; color: var(--vermelho); font: 600 16px var(--apoio); padding: 8px 0; margin: 0 0 8px; cursor: pointer; }
.campo { margin: 0 0 18px; }
.campo > label, fieldset legend { display: block; font-weight: 600; margin: 0 0 6px; }
fieldset { border: 0; padding: 0; margin: 0 0 18px; }
.ajuda { display: block; color: var(--cinza); font-size: 14px; margin: 4px 0 0; }
select, input[type=text], textarea { width: 100%; font: inherit; color: var(--grafite); background: #fff;
  border: 1px solid var(--cinza); border-radius: 10px; padding: 12px; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--cinza) 50%), linear-gradient(135deg, var(--cinza) 50%, transparent 50%);
  background-position: calc(100% - 20px) 55%, calc(100% - 14px) 55%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
textarea { min-height: 140px; resize: vertical; }
.opcao { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; }
.opcao input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--vermelho); flex: none; }
[aria-invalid=true] { border-color: var(--vermelho); border-width: 2px; }
.erro-campo { color: var(--vermelho); font-size: 14px; font-weight: 600; margin: 4px 0 0; }
.consentimento { background: var(--prata); border-left: 4px solid var(--dourado); border-radius: 8px; padding: 12px 14px; margin: 0 0 18px; }
.contador { float: right; font-weight: 400; color: var(--cinza); font-size: 14px; }
.enviar { width: 100%; padding: 16px; border: 0; border-radius: 14px; background: var(--vermelho); color: var(--prata);
  font: 600 18px var(--apoio); cursor: pointer; }
.enviar:disabled { opacity: .6; cursor: wait; }
.aviso { border-radius: 10px; padding: 12px 14px; margin: 0 0 16px; background: #fff; border: 2px solid var(--vermelho); font-weight: 600; }
.robo { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
.obrigado { text-align: center; padding-top: 24px; }
</style></head>
<body>
<main>
  <section id="inicio">
    <header class="topo">
      <img class="avatar" src="avatar.jpg" alt="" width="96" height="96">
      <h1 data-texto="titulo"></h1>
      <p class="sub" data-texto="subtitulo"></p>
      <p class="lema"><span data-texto="lema"></span><small data-texto="lema_ref"></small></p>
    </header>
    <hr class="filete">
    <p class="convite" data-texto="convite"></p>
    <button class="caminho" type="button" data-abrir="agente"><strong data-texto="botao_agente"></strong><span data-texto="botao_agente_apoio"></span></button>
    <button class="caminho" type="button" data-abrir="fiel"><strong data-texto="botao_fiel"></strong><span data-texto="botao_fiel_apoio"></span></button>
    <a class="instagram" href="https://www.instagram.com/pastoraldodizimo.arquifln/" rel="noopener">@pastoraldodizimo.arquifln</a>
    <noscript><p class="aviso">Para enviar sua mensagem, ative o JavaScript no navegador.</p></noscript>
  </section>

  <section id="formulario" hidden>
    <button class="voltar" type="button" id="voltar">‹ <span data-texto="voltar"></span></button>
    <h2 id="form-titulo"></h2>
    <div class="aviso" id="aviso" role="alert" hidden></div>
    <form id="form" novalidate>
      <div id="campos"></div>
      <div class="robo" aria-hidden="true"><label>Site <input type="text" name="site" tabindex="-1" autocomplete="off"></label></div>
      <div class="consentimento campo">
        <label class="opcao"><input type="checkbox" name="consentimento" id="consentimento"><span data-texto="consentimento"></span></label>
      </div>
      <button class="enviar" type="submit" id="enviar"></button>
    </form>
  </section>

  <section id="obrigado" class="obrigado" hidden>
    <h2 data-texto="obrigado_titulo"></h2>
    <p data-texto="obrigado_texto"></p>
    <button class="voltar" type="button" id="recomecar">‹ <span data-texto="voltar"></span></button>
  </section>
</main>
<script id="dados" type="application/json">{{dados}}</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("dados").textContent);
  var T = D.textos, C = D.campos;
  var $ = function (id) { return document.getElementById(id); };
  var tipoAtual = null;

  // textos fixos vindos do content/formularios.yaml
  Array.prototype.forEach.call(document.querySelectorAll("[data-texto]"), function (el) {
    var k = el.getAttribute("data-texto");
    el.textContent = k === "consentimento" ? D.consentimento : T[k];
  });
  $("enviar").textContent = T.enviar;

  function el(tag, attrs, filhos) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    (filhos || []).forEach(function (f) { n.appendChild(typeof f === "string" ? document.createTextNode(f) : f); });
    return n;
  }
  function erroDe(nome) { return el("p", { "class": "erro-campo", id: "erro-" + nome, hidden: "" }); }

  function campoSelect(nome, rotulo, opcoes, vazio) {
    var s = el("select", { id: "f-" + nome, name: nome, "aria-describedby": "erro-" + nome });
    s.appendChild(el("option", { value: "" }, [vazio]));
    opcoes.forEach(function (o) { s.appendChild(el("option", { value: o }, [o])); });
    return el("div", { "class": "campo", id: "c-" + nome }, [el("label", { "for": "f-" + nome }, [rotulo]), s, erroDe(nome)]);
  }
  function campoTexto(nome, rotulo, ajuda, max) {
    var i = el("input", { type: "text", id: "f-" + nome, name: nome, maxlength: String(max), "aria-describedby": "ajuda-" + nome + " erro-" + nome });
    return el("div", { "class": "campo", id: "c-" + nome }, [el("label", { "for": "f-" + nome }, [rotulo]), i,
      el("span", { "class": "ajuda", id: "ajuda-" + nome }, [ajuda || ""]), erroDe(nome)]);
  }
  function campoLongo(nome, rotulo) {
    var max = C.limites.texto_longo;
    var cont = el("span", { "class": "contador", "aria-hidden": "true" }, ["0/" + max]);
    var t = el("textarea", { id: "f-" + nome, name: nome, maxlength: String(max), "aria-describedby": "erro-" + nome });
    t.addEventListener("input", function () { cont.textContent = t.value.length + "/" + max; });
    return el("div", { "class": "campo", id: "c-" + nome }, [el("label", { "for": "f-" + nome }, [rotulo, cont]), t, erroDe(nome)]);
  }
  function campoTemas(rotulo, temas) {
    var fs = el("fieldset", { id: "c-temas", "aria-describedby": "erro-temas" }, [el("legend", {}, [rotulo])]);
    temas.forEach(function (t, i) {
      fs.appendChild(el("label", { "class": "opcao" }, [el("input", { type: "checkbox", name: "temas", value: t, id: "f-temas-" + i }), el("span", {}, [t])]));
    });
    fs.appendChild(erroDe("temas"));
    return fs;
  }

  function montar(tipo) {
    var box = $("campos"), R = D[tipo].rotulos, curto = C.limites.texto_curto;
    box.textContent = "";
    var paroquias = C.paroquias.concat([C.outra]);
    if (tipo === "fiel") paroquias.push(C.prefiro_nao_dizer);
    box.appendChild(campoSelect("paroquia", R.paroquia, paroquias, "Escolha pela cidade…"));
    var outra = campoTexto("paroquia_outra", R.paroquia_outra, "", curto);
    outra.hidden = true;
    box.appendChild(outra);
    if (tipo === "agente") {
      box.appendChild(campoSelect("funcao", R.funcao, C.agente.funcoes, "Escolha…"));
      box.appendChild(campoSelect("pedido", R.pedido, C.agente.pedidos, "Escolha…"));
      box.appendChild(campoTemas(R.temas, C.agente.temas));
      box.appendChild(campoLongo("descricao", R.descricao));
    } else {
      box.appendChild(campoSelect("assunto", R.assunto, C.fiel.assuntos, "Escolha…"));
      box.appendChild(campoLongo("mensagem", R.mensagem));
    }
    box.appendChild(campoTexto("nome", R.nome, "", curto));
    box.appendChild(campoTexto("contato", R.contato, R.contato_ajuda_opcional, curto));
    $("f-paroquia").addEventListener("change", function () {
      outra.hidden = this.value !== C.outra;
    });
    if (tipo === "agente") $("f-pedido").addEventListener("change", atualizarContato);
  }

  function contatoObrigatorio() {
    return tipoAtual === "agente" && C.agente.pedidos_com_contato.indexOf($("f-pedido").value) >= 0;
  }
  function atualizarContato() {
    var R = D.agente.rotulos, obrig = contatoObrigatorio();
    $("ajuda-contato").textContent = obrig ? R.contato_ajuda_obrigatorio : R.contato_ajuda_opcional;
  }

  function mostrar(qual) {
    ["inicio", "formulario", "obrigado"].forEach(function (s) { $(s).hidden = s !== qual; });
    window.scrollTo(0, 0);
  }
  function abrir(tipo) {
    tipoAtual = tipo;
    $("form").reset();
    montar(tipo);
    $("form-titulo").textContent = D[tipo].titulo;
    $("aviso").hidden = true;
    mostrar("formulario");
  }
  // #agente e #fiel abrem o formulário (o "voltar" do navegador volta ao início)
  function rota() {
    var h = location.hash.replace("#", "");
    if (h === "agente" || h === "fiel") { if (tipoAtual !== h || $("formulario").hidden) abrir(h); }
    else { tipoAtual = null; mostrar("inicio"); }
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-abrir]"), function (b) {
    b.addEventListener("click", function () { location.hash = b.getAttribute("data-abrir"); });
  });
  $("voltar").addEventListener("click", function () { location.hash = ""; });
  $("recomecar").addEventListener("click", function () { location.hash = ""; });
  window.addEventListener("hashchange", rota);

  function coletar() {
    var f = $("form"), v = function (n) { return f.elements[n] ? f.elements[n].value.trim() : ""; };
    var corpo = { tipo: tipoAtual, paroquia: v("paroquia"), nome: v("nome"), contato: v("contato"),
      consentimento: $("consentimento").checked, site: v("site") };
    if (corpo.paroquia === C.outra) corpo.paroquia_outra = v("paroquia_outra");
    if (tipoAtual === "agente") {
      corpo.funcao = v("funcao"); corpo.pedido = v("pedido"); corpo.descricao = v("descricao");
      corpo.temas = Array.prototype.filter.call(f.querySelectorAll("input[name=temas]"), function (c) { return c.checked; })
        .map(function (c) { return c.value; });
    } else {
      corpo.assunto = v("assunto"); corpo.mensagem = v("mensagem");
    }
    return corpo;
  }
  // mesma regra do servidor (links/lib/validar.js), para avisar antes de enviar
  function conferir(c) {
    var e = [];
    if (tipoAtual === "agente") {
      if (!c.paroquia) e.push("paroquia");
      if (!c.funcao) e.push("funcao");
      if (!c.pedido) e.push("pedido");
      if (!c.temas.length) e.push("temas");
      if (!c.descricao) e.push("descricao");
      if (contatoObrigatorio()) { if (!c.nome) e.push("nome"); if (!c.contato) e.push("contato"); }
    } else {
      if (!c.assunto) e.push("assunto");
      if (!c.mensagem) e.push("mensagem");
    }
    if (c.paroquia === C.outra && !c.paroquia_outra) e.push("paroquia_outra");
    if (!c.consentimento) e.push("consentimento");
    return e;
  }
  var MSG = { consentimento: "Marque a autorização para enviar.", temas: "Marque ao menos um tema." };
  function marcar(erros) {
    Array.prototype.forEach.call(document.querySelectorAll(".erro-campo"), function (p) { p.hidden = true; p.textContent = ""; });
    Array.prototype.forEach.call(document.querySelectorAll("[aria-invalid]"), function (n) { n.removeAttribute("aria-invalid"); });
    erros.forEach(function (nome) {
      var campo = $("f-" + nome) || $("c-" + nome) || $(nome);
      if (campo) campo.setAttribute("aria-invalid", "true");
      var p = $("erro-" + nome);
      if (p) { p.textContent = MSG[nome] || "Preencha este campo."; p.hidden = false; }
    });
    if (erros.indexOf("consentimento") >= 0 && !$("erro-consentimento")) {
      var p2 = el("p", { "class": "erro-campo", id: "erro-consentimento" }, [MSG.consentimento]);
      $("consentimento").closest(".consentimento").appendChild(p2);
    }
  }
  function avisar(texto) { var a = $("aviso"); a.textContent = texto; a.hidden = !texto; if (texto) a.scrollIntoView({ block: "center" }); }

  $("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var corpo = coletar(), erros = conferir(corpo);
    marcar(erros);
    if (erros.length) { avisar(T.erro_campos); return; }
    avisar("");
    var botao = $("enviar");
    botao.disabled = true; botao.textContent = T.enviando;
    fetch("api/resposta", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, j: j }; });
      })
      .then(function (res) {
        if (res.status === 200 && res.j.ok) { tipoAtual = null; mostrar("obrigado"); return; }
        if (res.status === 400 && res.j.erros) { marcar(res.j.erros); avisar(T.erro_campos); return; }
        avisar(res.status === 429 ? T.erro_limite : T.erro_geral);
      })
      .catch(function () { avisar(T.erro_geral); })
      .then(function () { botao.disabled = false; botao.textContent = T.enviar; });
  });

  rota();
})();
</script>
</body></html>
