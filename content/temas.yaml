# Fila de temas — extraída de docs/marca/estrategia-instagram.md, cap. 11 ("Primeiros 30 Conteúdos").
# Reels (posts 10, 11, 12, 13, 14, 21, 25) ficam FORA: são produzidos manualmente (ADR-000).
# pilar: pilar da linha editorial (cap. 9). Posts marcados "Espiritualidade"/"Transparência" na estratégia
#   são eixos temáticos e contam como Formação (ADR-004); o rótulo original fica em pilar_original.
# formato: carrossel | imagem_unica (o formato original fica em formato_original).
# pendencia: dado real que precisa existir antes de gerar (nada é inventado).
# a_validar: marcado em amarelo no documento original.

temas:
  - numero: 1
    titulo: Bem-vindos à Pastoral do Dízimo
    pilar: Formação
    formato: carrossel
    resumo: "Apresentação institucional: quem somos, missão e convite a caminhar juntos."
    cta: Seguir o perfil
    publico: Todos os públicos

