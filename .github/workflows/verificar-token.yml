# Diagnóstico manual: confere se o IG_ACCESS_TOKEN funciona (GET /me). Não publica nada.
name: verificar-token
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: GET /me (somente leitura)
        env:
          PYTHONPATH: src
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID || '0' }}
        run: python -m pastoral.meta --verificar
