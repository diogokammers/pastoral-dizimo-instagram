# Renovação semanal do token longo do Instagram Login (ADR-008, arquitetura §1.1 token.py).
# O token novo nunca é impresso: vai para um arquivo temporário e dali para o secret via `gh`.
# Sem GH_PAT_SECRETS, o job só alerta (o Diogo atualiza o secret à mão ou cadastra o PAT).
name: token
on:
  schedule:
    - cron: "0 12 * * 1"         # segunda, 09:00 em Brasília
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: token
  cancel-in-progress: false
jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML
      - name: refresh_access_token
        env:
          PYTHONPATH: src
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: python -m pastoral.meta --renovar --saida "$RUNNER_TEMP/ig_token"
      - name: Atualiza o secret IG_ACCESS_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_PAT_SECRETS não cadastrado: o token foi renovado na Meta, mas o secret IG_ACCESS_TOKEN não foi atualizado. O token antigo continua valendo até expirar; cadastre o PAT ou atualize o secret à mão."
          else
            gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/ig_token"
            echo "Secret IG_ACCESS_TOKEN atualizado."
          fi
          rm -f "$RUNNER_TEMP/ig_token"
